<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS ERP System</title>
    <!-- Pretendard 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
    <!-- SheetJS (엑셀 파싱/다운로드) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <!-- Chart.js (차트 시각화) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --sidebar-bg: #222731;
            --sidebar-hover: #2c323f;
            --sidebar-active: #2563eb;
            --sidebar-sub-bg: #1a1e26;
            --sidebar-text: #94a3b8;
            --sidebar-header: #181b22;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); font-family: 'Pretendard', sans-serif; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* 단색 전체화면 로그인 페이지 스타일 */
        #loginPageContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1e26;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .login-box-card {
            background-color: #222731;
            border: 1px solid #2d3545;
            border-radius: 12px;
            width: 400px;
            padding: 40px 32px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            color: #ffffff;
        }

        .login-brand-head {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .login-sub-head {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 28px;
        }

        .login-input-group {
            margin-bottom: 16px;
        }

        .login-input-group label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .login-input-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            background: #181b22;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s;
        }

        .login-input-group input:focus {
            border-color: #2563eb;
            background: #1a1e26;
        }

        .login-options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 16px;
        }

        .btn-main-login {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
        }

        .btn-main-login:hover {
            background-color: #1d4ed8;
        }

        /* 메인 ERP 레이아웃 */
        .sidebar { width: 250px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid #1e232d; }
        .sidebar-brand { height: 60px; background-color: var(--sidebar-header); color: #ffffff; display: flex; align-items: center; padding: 0 20px; font-size: 17px; font-weight: 800; letter-spacing: 0.5px; border-bottom: 1px solid #272d38; }
        
        .sidebar-menu { flex: 1; padding: 12px 0; overflow-y: auto; }
        .menu-category { font-size: 11px; font-weight: 700; color: #475569; padding: 12px 20px 6px 20px; letter-spacing: 0.5px; }
        
        .nav-item { display: flex; align-items: center; padding: 12px 20px; color: #cbd5e1; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; border-left: 4px solid transparent; }
        .nav-item:hover { background-color: var(--sidebar-hover); color: #ffffff; }
        .nav-item.active { background-color: #1e2430; color: #38bdf8; border-left-color: #38bdf8; font-weight: 700; }

        .parent-menu { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; color: #e2e8f0; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; background-color: var(--sidebar-bg); }
        .parent-menu:hover { background-color: var(--sidebar-hover); }
        .arrow-icon { font-size: 10px; transition: transform 0.3s; color: #64748b; }
        .parent-menu.open .arrow-icon { transform: rotate(180deg); color: #38bdf8; }

        .submenu { display: none; background-color: var(--sidebar-sub-bg); }
        .submenu.open { display: block; }
        .sub-item { display: flex; align-items: center; padding: 10px 20px 10px 32px; color: var(--sidebar-text); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .sub-item:hover { color: #ffffff; background-color: rgba(255,255,255,0.03); }
        .sub-item.active { color: #38bdf8; font-weight: 700; background-color: rgba(56, 189, 248, 0.08); }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 60px; background-color: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; border-bottom: 1px solid var(--border-color); box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .header-title { font-size: 18px; font-weight: 800; color: #0f172a; display: flex; align-items: center; }
        .header-actions { display: flex; gap: 10px; align-items: center; }

        .search-box { display: flex; align-items: center; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px 10px; width: 320px; }
        .search-box input { border: none; background: transparent; outline: none; font-size: 13px; width: 100%; padding: 6px 4px; }

        .btn { padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; display: flex; align-items: center; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-outline { background: white; border-color: var(--border-color); color: var(--text-main); }
        .btn-outline:hover { background: #f8fafc; }

        .container { flex: 1; padding: 24px 28px; overflow-y: auto; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: white; border-radius: 8px; width: 560px; max-width: 90%; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-header { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 4px; outline: none; }
    </style>
</head>
<body>

    <!-- 단색 전체화면 최초 로그인 화면 -->
    <div id="loginPageContainer">
        <form class="login-box-card" onsubmit="event.preventDefault(); processKCDLogin();">
            <div class="login-brand-head">CMS ERP System</div>
            <div class="login-sub-head">전사적 자원관리를 위한 통합 로그인 페이지</div>
            
            <div class="login-input-group">
                <label>아이디</label>
                <input type="text" id="kcd_login_id" value="" placeholder="아이디 입력" autocomplete="username" required>
            </div>
            <div class="login-input-group">
                <label>비밀번호</label>
                <input type="password" id="kcd_login_pw" value="" placeholder="비밀번호 입력" autocomplete="current-password" required>
            </div>
            <div class="login-options-row">
                <label style="cursor:pointer;"><input type="checkbox" id="remember_id_check"> 아이디 저장</label>
            </div>
            <button type="submit" class="btn-main-login">시스템 로그인</button>
            <div style="text-align: center; margin-top: 16px;">
                <a href="javascript:void(0)" style="font-size: 12px; color: #38bdf8; text-decoration: none;" onclick="openModal('findPwModal')">비밀번호 변경/찾기</a>
            </div>
        </form>
    </div>

    <!-- 비밀번호 찾기 / 변경 모달 -->
    <div id="findPwModal" class="modal-overlay">
        <div class="modal-card" style="width: 440px;">
            <div class="modal-header">
                <span>비밀번호 찾기 및 변경</span>
                <span style="cursor:pointer;" onclick="closeModal('findPwModal')">✕</span>
            </div>
            <div class="form-group"><label>아이디</label><input type="text" id="find_id" placeholder="아이디 입력"></div>
            <div class="form-group"><label>이름</label><input type="text" id="find_name" placeholder="이름 입력"></div>
            <div class="form-group"><label>핸드폰 번호 또는 이메일</label><input type="text" id="find_contact" placeholder="핸드폰 번호 또는 이메일 입력"></div>
            <div class="form-group" style="border-top:1px dashed #e2e8f0; padding-top:10px; margin-top:10px;">
                <label style="color:#2563eb;">새로 변경할 비밀번호</label>
                <input type="password" id="find_new_pw" placeholder="새 비밀번호 입력">
            </div>
            <div style="display:flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                <button class="btn btn-outline" onclick="closeModal('findPwModal')">취소</button>
                <button class="btn btn-primary" onclick="processFindAndResetPw()">비밀번호 변경 저장</button>
            </div>
        </div>
    </div>

    <!-- 메인 ERP 레이아웃 생략없이 통합 포함 -->
    <div class="sidebar">
        <div class="sidebar-brand">CMS ERP System</div>
        <div class="sidebar-menu">
            <div class="menu-category">MAIN MENU</div>
            <div class="nav-item active">대시보드</div>
        </div>
    </div>

    <div class="main-content">
        <header class="header">
            <div class="header-title">전체 현황 대시보드</div>
            <div class="header-actions">
                <span id="userStatusBadge" style="font-size:12px; font-weight:700; color:#2563eb; background:#eff6ff; padding:4px 8px; border-radius:4px;">미로그인</span>
                <button class="btn btn-outline" style="font-size:12px; padding:6px 10px;" id="loginLogoutBtn" onclick="handleAuthBtnClick()">로그인</button>
            </div>
        </header>
        <div class="container">
            <div class="view-section active">
                <h3>대시보드</h3>
                <p>시스템에 정상 로그인되었습니다.</p>
            </div>
        </div>
    </div>

    <script>
        let userAccountsList = [
            { id: "admin", pw: "1234", name: "최고관리자", role: "관리자", phone: "010-0000-0000", email: "admin@imupos.com", isBlocked: false },
            { id: "psei", pw: "1111", name: "박세이", role: "관리자", phone: "010-9324-1452", email: "psei@imupos.com", isBlocked: false }
        ];

        let currentUser = null;

        window.openModal = function(id) {
            let target = document.getElementById(id);
            if (target) target.style.display = 'flex';
        };

        window.closeModal = function(id) {
            let target = document.getElementById(id);
            if (target) target.style.display = 'none';
        };

        window.addEventListener('DOMContentLoaded', () => {
            let savedSessionUser = sessionStorage.getItem('cms_session_user');
            let savedRememberId = localStorage.getItem('cms_remember_id');

            if (savedSessionUser) currentUser = JSON.parse(savedSessionUser);

            if (savedRememberId) {
                let idInput = document.getElementById('kcd_login_id');
                let chkInput = document.getElementById('remember_id_check');
                if (idInput) idInput.value = savedRememberId;
                if (chkInput) chkInput.checked = true;
            }

            updateAuthUI();
        });

        function updateAuthUI() {
            let badge = document.getElementById('userStatusBadge');
            let btn = document.getElementById('loginLogoutBtn');
            let kcdLoginPage = document.getElementById('loginPageContainer');

            if (!currentUser) {
                badge.innerText = "미로그인";
                btn.innerText = "로그인";
                kcdLoginPage.style.display = 'flex';
            } else {
                badge.innerText = `${currentUser.name || currentUser.id}`;
                btn.innerText = "로그아웃";
                kcdLoginPage.style.display = 'none';
            }
        }

        function processKCDLogin() {
            try {
                let id = document.getElementById('kcd_login_id').value.trim();
                let pw = document.getElementById('kcd_login_pw').value.trim();
                let rememberChk = document.getElementById('remember_id_check');

                if (!id || !pw) {
                    alert("아이디와 비밀번호를 입력해 주세요.");
                    return;
                }

                let target = userAccountsList.find(u => u.id === id && u.pw === pw);
                if (!target) {
                    alert("아이디 또는 비밀번호가 올바르지 않습니다.");
                    return;
                }

                if (target.isBlocked) {
                    alert("해당 계정은 블락(차단)된 상태입니다.");
                    return;
                }

                if (rememberChk && rememberChk.checked) {
                    localStorage.setItem('cms_remember_id', id);
                } else {
                    localStorage.removeItem('cms_remember_id');
                }

                currentUser = { id: target.id, name: target.name, role: target.role };
                sessionStorage.setItem('cms_session_user', JSON.stringify(currentUser));
                updateAuthUI();
                alert(`${target.name || target.id}님 로그인 되었습니다.`);
            } catch (e) {
                alert("로그인 처리 중 오류 발생: " + e.message);
            }
        }

        function handleAuthBtnClick() {
            if (currentUser) {
                currentUser = null;
                sessionStorage.removeItem('cms_session_user');
                updateAuthUI();
                alert("로그아웃 되었습니다.");
            } else {
                document.getElementById('loginPageContainer').style.display = 'flex';
            }
        }

        function processFindAndResetPw() {
            let id = document.getElementById('find_id').value.trim();
            let name = document.getElementById('find_name').value.trim();
            let contact = document.getElementById('find_contact').value.trim();
            let newPw = document.getElementById('find_new_pw').value.trim();

            if (!id || !name || !contact || !newPw) {
                alert("모든 입력값을 작성해 주세요.");
                return;
            }

            let target = userAccountsList.find(u => u.id === id && u.name === name && (u.phone === contact || u.email === contact));
            if (target) {
                target.pw = newPw;
                alert(`[비밀번호 변경 완료]\n새 비밀번호로 로그인해 주세요.`);
                closeModal('findPwModal');
            } else {
                alert("일치하는 계정 정보가 없습니다.");
            }
        }
    </script>
</body>
</html>
